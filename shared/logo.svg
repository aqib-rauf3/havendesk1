<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <!-- HavenDesk Minimalist Logo & Wordmark -->
  <!-- Icon: Calm Haven Arch + Signal Dot -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1.5"/>
    <!-- Gentle shelter arch -->
    <path d="M12 26 C12 17, 28 17, 28 26" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Steady presence dot -->
    <circle cx="20" cy="14" r="3" fill="#0d9488"/>
  </g>
  <!-- Wordmark -->
  <text x="56" y="30" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="currentColor" letter-spacing="-0.03em">
    Haven<tspan font-weight="400" fill="#0d9488">Desk</tspan>
  </text>
</svg>
